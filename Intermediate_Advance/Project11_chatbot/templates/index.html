<!DOCTYPE html>
<html>
<head>
    <title>ARIA - AI Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1e1e1e; color: white; font-family: Arial; height: 100vh; display: flex; flex-direction: column; }
        h1 { text-align: center; padding: 20px; color: #00d4ff; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .user-msg { background: #0078d4; padding: 10px 15px; border-radius: 15px; align-self: flex-end; max-width: 60%; }
        .ai-msg { background: #333; padding: 10px 15px; border-radius: 15px; align-self: flex-start; max-width: 60%; }
        #input-area { display: flex; padding: 20px; gap: 10px; background: #2d2d2d; }
        #input-area input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #444; color: white; font-size: 15px; }
        #input-area button { padding: 12px 25px; background: #00d4ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🤖 ARIA — AI Assistant</h1>
    <div id="chat-box">
            {% for msg in history %}
            {% if msg.role == "user" %}
                <div class="user-msg">You: {{ msg.content }}</div>
            {% elif msg.role == "assistant" %}
                <div class="ai-msg">ARIA: {{ msg.content }}</div>
            {% endif %}
        {% endfor %}
    </div>
    <form id="input-area" action="/chat" method="POST">
        <input type="text" name="message" placeholder="Talk to ARIA..." autofocus autocomplete="off">
        <button type="submit">Send</button>
    </form>
</body>
</html>
